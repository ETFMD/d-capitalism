name: 실적발표 캘린더 갱신

# 코스피 TOP 100 · 미국 상장 TOP 100 실적발표일·실적·PER (data/earnings.json · earnings_kr.json · earnings_us.json)
#  · 매시간(발표가 몰리는 때 30분마다 — 방문자 수 Worker 15분 cron 이 실행시킴 · worker/src/index.js earnDue) + 아래 GitHub 예약(늦거나 빠질 때 대비) — 주가·시가총액·PER = 최근 확정 종가 × 주식 수(매일 바뀜) · 잠정실적·IR 일정·미국 발표일·EPS 1시간(발표가 몰리는 때 30분) 안에 반영
#  · 재무표는 회사마다 20시간에 한 번 + 최근 4일 안에 발표한 회사는 매번 다시 받음 (스크립트가 시간 예산 안에서 나눠 받음)
#  · 내용이 바뀐 경우에만 커밋
on:
  schedule:
    - cron: '23 */2 * * *'
    - cron: '45 6 * * 1-5'     # 한국 장 마감 직후 15:45 KST → 국내 그날 종가로 시가총액·PER
    - cron: '20 20 * * 1-5'    # 미국 장 마감 직후 16:20 ET(서머타임) = 05:20 KST
    - cron: '20 21 * * 1-5'    # 미국 장 마감 직후 16:20 ET(표준시) = 06:20 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_earnings.py', '.github/workflows/update-earnings.yml']

permissions:
  contents: write

concurrency:
  # 자기 그룹 — 15분마다 도는 '시세 데이터 갱신'(market-data 그룹)과 같은 그룹이면, 앞 실행이 도는 동안 기다리던 실적 실행이
  # 다음 시세 실행에 밀려 취소될 수 있음(한 그룹에 대기는 1개만). 커밋 파일이 서로 달라(data/earnings*) 아래 pull --rebase 로 충분
  group: earnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: 실적발표 자료 수집
        env:
          EARN_BUDGET: '420'
        run: python3 scripts/update_earnings.py
      - name: 변경된 경우에만 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git add data/earnings.json data/earnings_kr.json data/earnings_us.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: 실적발표 캘린더 갱신"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
