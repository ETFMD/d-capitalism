# 무한매수법 백테스트 설정 탐색 1단계 (임시 브랜치 muhan-opt 전용 — main 에는 없음)
# 2026-10-13 다시: 평단 LOC 괴리율 0% 고정(FIX=avgOff=0) — 괴리율을 쓰는 V1.0·V2.0·V2.1 만 (V2.2~V4.0 은 괴리율을 쓰지 않아 지난 결과 그대로)
name: 무한매수법 설정 탐색
on:
  push:
    branches: [muhan-opt]
  workflow_dispatch:
jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FIX: avgOff=0
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        per: [pre, act]
        ver: ['2.1', '2.0', '1.0']
        tk: [UPRO, TQQQ, SOXL, TECL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 탐색 ${{ matrix.tk }} ${{ matrix.per }} V${{ matrix.ver }}
        run: nproc && node opt/muhan_opt.js ${{ matrix.tk }} ${{ matrix.per }} ${{ matrix.ver }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt-${{ matrix.tk }}-${{ matrix.per }}-${{ matrix.ver }}
          path: opt/out/
          retention-days: 7
