# 무한매수법 백테스트 설정 탐색 (임시 브랜치 muhan-opt 전용 — main 에는 없음)
name: 무한매수법 설정 탐색
on:
  push:
    branches: [muhan-opt]
  workflow_dispatch:
jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        per: [pre, act]
        ver: ['2.2', '3.0', '2.1', '2.0', '1.0', '4.0']
        tk: [UPRO, TQQQ, SOXL, TECL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 탐색 ${{ matrix.tk }} ${{ matrix.per }} V${{ matrix.ver }}
        run: nproc && node opt/muhan_opt.js ${{ matrix.tk }} ${{ matrix.per }} ${{ matrix.ver }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt-${{ matrix.tk }}-${{ matrix.per }}-${{ matrix.ver }}
          path: opt/out/
          retention-days: 7
