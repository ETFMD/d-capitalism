name: ETF 차트 비교 상장 전 백테스트 갱신

# ETF 차트 비교(/etf-compare/)의 '상장 전 백테스트'(점선) 재현 식
#  · data/etfbt/0~15.json — ETF 마다 재현 식(후보·시차·배수·환 노출/헤지·콜 매도 덧씌우기)·검증 오차·백테스트 시작일·분배 습관
#      (묶음 번호 = 키('K:069500'·'U:SPY') 글자 코드 합 % 16 · 화면은 고른 종목의 묶음만 받음)
#  · data/etfbt/r/*.json — 화면이 같은 식으로 계산할 때 쓰는 금리(현금·채권 지수)·원/달러 15:30 종가·S&P 500 TR 1988년 전 부분·식에 쓴 Cboe 옵션 전략 지수(C_*)
#  · 1) scripts/etf_bt_data.py: 국내·미국 ETF·지수·환율·금리·상위 보유 종목·Cboe 옵션 전략 지수 일봉을 이어 받음(캐시 .btcache 는 actions/cache 로 다음 실행에 넘김)
#    2) scripts/etf_bt_fit.py : 상장 후 실제 값과 교차 검증해 오차가 가장 작은 식을 다시 고름
#  · 매주 토요일 KST 08:20 (미국 금요일 마감 뒤) · 수동 실행에서 full=true 면 일봉을 모두 처음부터
on:
  schedule:
    - cron: '20 23 * * 5'
  workflow_dispatch:
    inputs:
      full:
        description: '일봉을 모두 처음부터 다시 받기'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/etf_bt_data.py', 'scripts/etf_bt_fit.py', '.github/workflows/update-etf-bt.yml']

permissions:
  contents: write

concurrency:
  group: etf-bt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: numpy
        run: pip install numpy
      - name: 캐시 불러오기 (지난 실행의 일봉·구성 정보)
        uses: actions/cache/restore@v4
        with:
          path: .btcache
          key: etfbt-${{ github.run_id }}
          restore-keys: etfbt-
      - name: 일봉·구성 정보·금리·환율 받기
        run: python3 scripts/etf_bt_data.py --cache .btcache --threads 6 ${{ github.event_name == 'workflow_dispatch' && inputs.full && '--full' || '' }}
      - name: 받기 실패한 종목만 한 번 더 (일시 오류 · 천천히)
        run: python3 scripts/etf_bt_data.py --cache .btcache --threads 2 --retry-err --skip-meta
      - name: 캐시 저장 (재현 식 계산이 실패해도 다음 실행이 이어 받게)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .btcache
          key: etfbt-${{ github.run_id }}
      - name: 재현 식 고르기 (교차 검증)
        run: python3 scripts/etf_bt_fit.py --cache .btcache
      - name: 내용이 바뀐 경우에만 커밋 (계산 시각만 바뀐 파일은 커밋하지 않음)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          changed=''
          for f in data/etfbt/*.json data/etfbt/r/*.json; do
            if ! git show HEAD:$f > /tmp/old.json 2>/dev/null; then changed="$changed $f"; continue; fi
            if ! python3 -c "import json,sys;a=json.load(open('/tmp/old.json'));b=json.load(open('$f'));a.pop('updated',None);b.pop('updated',None);sys.exit(0 if a==b else 1)"; then changed="$changed $f"; fi
          done
          if [ -z "$changed" ]; then echo "백테스트 식 변경 없음"; exit 0; fi
          git add $changed
          git commit -m "chore: ETF 차트 비교 상장 전 백테스트 식 갱신"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
