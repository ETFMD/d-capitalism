name: ETF 차트 비교 상장 전 백테스트 갱신

# ETF 차트 비교(/etf-compare/)의 '상장 전 백테스트'(점선) 재현 식
#  · data/etfbt/0~15.json — ETF 마다 재현 식(후보·시차·배수·환 노출/헤지·콜 매도 덧씌우기)·검증 오차·백테스트 시작일·분배 습관
#      (묶음 번호 = 키('K:069500'·'U:SPY') 글자 코드 합 % 16 · 화면은 고른 종목의 묶음만 받음)
#  · data/etfbt/r/*.json — 화면이 같은 식으로 계산할 때 쓰는 금리(현금·채권 지수)·원/달러 15:30 종가·S&P 500 TR 1988년 전 부분·식에 쓴 옵션 전략 지수(C_* Cboe · D_* 한국거래소)
#      · 모의 커버드콜(Z_* — 코스피 200 에서 매일 블랙-숄즈로 다시 계산한 콜 값을 뺀 지수 · 변동성 VKOSPI · 2003년부터 · etf_bt_fit.py zsim_levels)
#  · 1) scripts/etf_bt_data.py: 국내·미국 ETF·지수·환율·금리·상위 보유 종목·옵션 전략 지수(Cboe · 한국거래소 · 모의 커버드콜 재료 코스피 200·VKOSPI) 일봉을 이어 받음(캐시 .btcache 는 actions/cache 로 다음 실행에 넘김)
#    2) scripts/etf_bt_fit.py : 상장 후 실제 값과 교차 검증해 오차가 가장 작은 식을 다시 고름
#    3) scripts/stratsim_prelist.py: 투자전략 시뮬레이터 상장 전 구간(data/stratsim/prelist.csv)을 같은 재현 식으로 다시 계산 — 지금 파일과
#       0.5% 넘게 다를 때만 씀 · 지금 prices.csv 사본에 반영해 봐서(update_stratsim.py --prelist-only) 되는 경우에만 커밋(안 되면 되돌림)
#       · 가격(prices.csv)·탐색기 표는 update-stratsim.yml 이 다음 실행에서 한 커밋으로 맞춤(이 워크플로는 prelist.csv 만 씀 — 두 워크플로가 같은 파일을 쓰지 않게)
#       · 이 단계가 실패해도 위 식 갱신은 그대로 커밋하고, 마지막에 작업을 실패로 표시(메일 알림)
#  · 매주 토요일 KST 08:20 (미국 금요일 마감 뒤) · 수동 실행에서 full=true 면 일봉을 모두 처음부터
on:
  schedule:
    - cron: '20 23 * * 5'
  workflow_dispatch:
    inputs:
      full:
        description: '일봉을 모두 처음부터 다시 받기'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/etf_bt_data.py', 'scripts/etf_bt_fit.py', 'scripts/stratsim_prelist.py', '.github/workflows/update-etf-bt.yml']

permissions:
  contents: write

concurrency:
  group: etf-bt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: numpy
        run: pip install numpy
      - name: 캐시 불러오기 (지난 실행의 일봉·구성 정보)
        uses: actions/cache/restore@v4
        with:
          path: .btcache
          key: etfbt-${{ github.run_id }}
          restore-keys: etfbt-
      - name: 일봉·구성 정보·금리·환율 받기
        run: python3 scripts/etf_bt_data.py --cache .btcache --threads 6 ${{ github.event_name == 'workflow_dispatch' && inputs.full && '--full' || '' }}
      - name: 받기 실패한 종목만 한 번 더 (일시 오류 · 천천히)
        run: python3 scripts/etf_bt_data.py --cache .btcache --threads 2 --retry-err --skip-meta
      - name: 캐시 저장 (재현 식 계산이 실패해도 다음 실행이 이어 받게)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .btcache
          key: etfbt-${{ github.run_id }}
      - name: 재현 식 고르기 (교차 검증)
        run: python3 scripts/etf_bt_fit.py --cache .btcache
      - name: 투자전략 시뮬레이터 상장 전 구간 (같은 재현 식)
        id: pre
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if ! python3 scripts/stratsim_prelist.py --cache .btcache; then
            echo "::warning::투자전략 시뮬레이터 상장 전 구간을 만들지 못함 — prelist.csv 그대로"; exit 1
          fi
          if [ -z "$(git status --porcelain -- data/stratsim/prelist.csv)" ]; then exit 0; fi
          # 지금 가격 자료 사본에 반영해 봄 — 안 되면(날짜 빠짐·상장 첫날 다름 등) 되돌려 매시간 갱신이 멈추지 않게
          t=$(mktemp -d); cp data/stratsim/prices.csv data/stratsim/prelist.csv data/stratsim/updated.txt "$t"/
          if ! STRATSIM_DIR="$t" python3 scripts/update_stratsim.py --prelist-only; then
            git checkout -- data/stratsim/prelist.csv
            echo "::warning::새 prelist.csv 를 가격 자료에 반영할 수 없어 되돌림"; exit 1
          fi
      - name: 내용이 바뀐 경우에만 커밋 (계산 시각만 바뀐 파일은 커밋하지 않음)
        env:
          PRE_OK: ${{ steps.pre.outcome }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          changed=''
          for f in data/etfbt/*.json data/etfbt/r/*.json; do
            if ! git show HEAD:$f > /tmp/old.json 2>/dev/null; then changed="$changed $f"; continue; fi
            if ! python3 -c "import json,sys;a=json.load(open('/tmp/old.json'));b=json.load(open('$f'));a.pop('updated',None);b.pop('updated',None);sys.exit(0 if a==b else 1)"; then changed="$changed $f"; fi
          done
          if [ "$PRE_OK" = "success" ]; then   # 상장 전 구간: 위 단계가 반영 확인까지 마친 경우만
            if [ -n "$(git status --porcelain -- data/stratsim/prelist.csv)" ]; then changed="$changed data/stratsim/prelist.csv"; fi
          else
            git checkout -- data/stratsim/prelist.csv 2>/dev/null || true
          fi
          deleted=$(git ls-files --deleted -- data/etfbt)   # 이제 쓰지 않는 옵션 전략 지수 파일 (etf_bt_fit.py write_out 이 지움)
          if [ -z "$changed" ] && [ -z "$deleted" ]; then echo "백테스트 식 변경 없음"; exit 0; fi
          if [ -n "$changed" ]; then git add $changed; fi
          if [ -n "$deleted" ]; then git rm -q --cached $deleted; fi
          git commit -m "chore: ETF 차트 비교 상장 전 백테스트 식 갱신"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: 상장 전 구간 단계가 실패했으면 작업을 실패로 표시 (위 식 갱신 커밋은 끝난 뒤)
        if: steps.pre.outcome == 'failure'
        run: |
          echo "투자전략 시뮬레이터 상장 전 구간(prelist.csv)을 갱신하지 못함 — 위 단계 기록 확인"; exit 1
