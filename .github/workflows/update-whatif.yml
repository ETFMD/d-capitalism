name: 그때 샀더라면 자료 갱신

on:
  schedule:
    - cron: '25 22 * * *'   # 매일 KST 07:25 (미국장 마감 후)
    - cron: '25 7 * * 1-5'  # 평일 KST 16:25 (한국장 마감 후)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_whatif.py', 'scripts/update_assetspeed.py', '.github/workflows/update-whatif.yml']

permissions:
  contents: write

concurrency:
  group: whatif-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 월봉 수집 (야후·네이버·FRED 환율·아파트 실거래 중위가)
        run: python3 scripts/update_whatif.py
      - name: 자산 속도 시뮬레이터 거시 자료 (한국은행 M2·소비자물가 월별)
        run: python3 scripts/update_assetspeed.py || echo "M2·물가 갱신 실패 — 직전 자료 유지"
      - name: 변경된 경우에만 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git add data/whatif.json data/assetspeed.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: 그때 샀더라면 자료 갱신"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
