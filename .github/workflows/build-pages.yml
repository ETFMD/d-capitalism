name: 도구별 주소 페이지 생성

# src/index.html(원본)·routes.json 이 바뀌면 홈(index.html)·도구별 <경로>/index.html, assets/app.<해시>.css·js, sitemap.xml, robots.txt, 404.html 을 다시 만듦
# (원본만 고쳐 올려도 모든 주소 페이지가 자동으로 맞춰짐 — 페이지마다 자기 도구 화면만 들어 있음)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 15 1 * *'   # 매월 2일 00:20 KST — 날짜가 들어간 정적 화면(나의 직업 수명 등)을 새 달 기준으로
    - cron: '40 9 * * 1-5'  # 평일 18:40 KST — 아시아 지수 마감 뒤 지수 해설 [IDXNOTE] 숫자 갱신 (data/history.json)
  # 데이터 봇이 끝나면 다시 빌드 → 투자 공부 글·지수 해설의 자동 숫자({{키}} · scripts/data_facts.py)가 새 자료를 따라감
  # (봇의 push 는 GITHUB_TOKEN 이라 push 이벤트로는 이 워크플로가 안 돌기 때문에 workflow_run 으로 연결)
  workflow_run:
    workflows: ['시가총액 순위 갱신', '실적발표 캘린더 갱신']
    types: [completed]
  push:
    branches: [main]
    paths: ['src/index.html', 'scripts/routes.json', 'scripts/build_pages.py', 'scripts/build_learn.py', 'scripts/data_facts.py', 'content/**', 'scripts/joblife_snapshot.js', 'scripts/i18n/**', 'assets/**', 'CNAME', '.github/workflows/build-pages.yml']

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 나의 직업 수명 첫 화면(정적) 날짜 갱신
        run: node scripts/joblife_snapshot.js
      - name: 페이지 생성
        run: python3 scripts/build_pages.py
      - name: 변경된 경우에만 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html '*/index.html' 'assets/app.*' sitemap.xml robots.txt 404.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: 도구별 주소 페이지 갱신"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          exit 1
