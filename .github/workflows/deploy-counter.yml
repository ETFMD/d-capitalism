name: 방문자 수 카운터 배포

# Cloudflare Worker + D1 로 '같은 IP는 하루 1번' 방문자 수를 셉니다.
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 두 개를 등록한 뒤 이 워크플로를 실행(Run workflow)하면
#   D1 데이터베이스 생성 → 표 만들기 → Worker 배포 → data/counter.json(주소) 저장까지 자동으로 합니다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-counter.yml', 'CNAME']
  schedule:
    - cron: '23 4 * * 1'   # 매주 월요일 한 번 다시 배포 (새로 등록·교체한 토큰 반영 확인용)

permissions:
  contents: write

concurrency:
  group: deploy-counter
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}   # 선택: 15분마다 시세 수집을 실행시킬 토큰 (저장소 1개 · Actions 쓰기)
      # 선택: 간편 로그인 — 카카오 디벨로퍼스·네이버 개발자센터·구글 클라우드에서 앱을 만든 뒤 저장소 시크릿에 등록 (LOGIN_SETUP.md)
      KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
      KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY || vars.KAKAO_JS_KEY }}   # 공개 값이라 저장소 변수(Variables)에 넣어도 됨
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # 선택: SNS 자동 게시(자산 속도 영상 → 유튜브·인스타·스레드·페이스북) — 각 개발자 앱의 ID·비밀값 (worker/src/sns.js · 설정 방법은 자산 속도 화면 'SNS 자동 게시' 안내)
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}             # 없으면 GOOGLE_CLIENT_ID/SECRET(간편 로그인 앱)을 같이 씀
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      TH_APP_ID: ${{ secrets.TH_APP_ID }}
      TH_APP_SECRET: ${{ secrets.TH_APP_SECRET }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_CONFIG_ID: ${{ secrets.FB_CONFIG_ID }}             # 선택: '비즈니스용 Facebook 로그인' 구성 ID (있으면 scope 대신 config_id)
    steps:
      - uses: actions/checkout@v5
      - name: 설정 확인
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다 (DATA_SETUP.md 참고)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.chk.outputs.skip != '1'
        with: { node-version: '22' }
      - name: D1 데이터베이스 준비 · Worker 배포
        if: steps.chk.outputs.skip != '1'
        working-directory: worker
        run: |
          set -euo pipefail
          npm i --no-save --silent wrangler@4
          W=./node_modules/.bin/wrangler
          DB=etfmd-visitors
          id=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name===process.argv[1]);process.stdout.write(x?x.uuid:"")})' "$DB")
          if [ -z "$id" ]; then
            $W d1 create "$DB" >/dev/null
            id=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name===process.argv[1]);process.stdout.write(x?x.uuid:"")})' "$DB")
          fi
          [ -n "$id" ] || { echo "D1 데이터베이스를 만들지 못했습니다"; exit 1; }
          origins="https://etfmd.github.io"
          if [ -f ../CNAME ]; then host=$(head -n1 ../CNAME | tr -d '[:space:]'); [ -n "$host" ] && origins="$origins,https://$host,https://www.$host"; fi
          sed -e "s/__D1_ID__/$id/" -e "s#__ORIGINS__#$origins#" wrangler.template.toml > wrangler.toml
          # SNS 자동 게시 영상 임시 보관(KV 'etfmd-sns' · 하루 뒤 자동 삭제) — 찾거나 만들어 연결 · 안 되면 KV 없이 배포(그 기능만 꺼짐)
          kvfind() { $W kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const x=a.find(n=>n.title==="etfmd-sns"||/-etfmd-sns$/.test(n.title));process.stdout.write(x?x.id:"")}catch(e){}})'; }
          kvid=$(kvfind) || true
          if [ -z "$kvid" ]; then $W kv namespace create etfmd-sns >/dev/null 2>&1 || true; kvid=$(kvfind) || true; fi
          if [ -n "$kvid" ]; then printf '\n[[kv_namespaces]]\nbinding = "SNS_KV"\nid = "%s"\n' "$kvid" >> wrangler.toml; echo "::notice::SNS 영상 보관 KV 연결"; else echo "::warning::SNS 영상 보관 KV 를 찾거나 만들지 못했습니다 (API 토큰에 Workers KV 권한 필요) — SNS 자동 게시만 꺼집니다"; fi
          $W d1 execute "$DB" --remote --file schema.sql -y
          if ! $W deploy | tee deploy.log; then
            ok=0
            # 디코딩 뉴스 Workers AI 연결([ai])이 원인일 수 있음 → 빼고 다시 (뉴스는 AI 정리 없이 원문 그대로 · 나머지 기능은 그대로)
            if grep -q '^\[ai\]$' wrangler.toml; then
              echo "::warning::Workers AI 연결과 함께 배포하지 못해 AI 없이 다시 배포합니다 (디코딩 뉴스는 원문 그대로)"
              sed -i '/^\[ai\]$/,/^binding = "AI"$/d' wrangler.toml
              $W deploy | tee deploy.log && ok=1
            fi
            if [ "$ok" = 0 ] && [ -n "$kvid" ]; then
              echo "::warning::KV 연결과 함께 배포하지 못해 KV 없이 다시 배포합니다 (SNS 자동 게시만 꺼짐)"
              sed -i '/^\[\[kv_namespaces\]\]/,$d' wrangler.toml
              $W deploy | tee deploy.log && ok=1
            fi
            [ "$ok" = 1 ] || exit 1
          fi
          if ! $W secret list 2>/dev/null | grep -q '"SALT"'; then
            openssl rand -hex 32 | $W secret put SALT
          fi
          # 간편 로그인: 서명 비밀값은 자동 생성 · 제공자 키는 GitHub 시크릿에 있을 때만 Worker 비밀값으로 옮김 (없으면 그 로그인 버튼은 숨김)
          if ! $W secret list 2>/dev/null | grep -q '"AUTH_SECRET"'; then
            openssl rand -hex 32 | $W secret put AUTH_SECRET >/dev/null
          fi
          # 72루틴 PC 생존 감시(/hb): 알림 대상 암호화 열쇠 — 없을 때 한 번만 자동 생성 (바꾸면 PC 프로그램이 다음 신호 때 알림 대상을 다시 보냄)
          if ! $W secret list 2>/dev/null | grep -q '"HB_KEY"'; then
            openssl rand -hex 32 | $W secret put HB_KEY >/dev/null
          fi
          # SNS 자동 게시: 연결 토큰 암호화 열쇠 — 없을 때 한 번만 자동 생성 (바꾸면 SNS 를 다시 연결해야 함)
          if ! $W secret list 2>/dev/null | grep -q '"SNS_KEY"'; then
            openssl rand -hex 32 | $W secret put SNS_KEY >/dev/null
          fi
          for k in KAKAO_JS_KEY KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_ADMIN_KEY NAVER_CLIENT_ID NAVER_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                   YT_CLIENT_ID YT_CLIENT_SECRET IG_APP_ID IG_APP_SECRET TH_APP_ID TH_APP_SECRET FB_APP_ID FB_APP_SECRET FB_CONFIG_ID; do
            v="${!k:-}"
            if [ -n "$v" ]; then printf '%s' "$v" | $W secret put "$k" >/dev/null && echo "::notice::$k 등록"; fi
          done
          if [ -n "${GH_DISPATCH_TOKEN:-}" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | $W secret put GH_TOKEN >/dev/null && echo "::notice::GH_TOKEN 등록 — 15분마다 시세 수집 실행"
          else
            echo "::notice::GH_DISPATCH_TOKEN 시크릿이 없어 15분 실행은 꺼져 있습니다 (GitHub 예약 실행만 사용)"
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          [ -n "$url" ] || { echo "workers.dev 주소를 찾지 못했습니다 — Cloudflare 대시보드에서 Workers 하위 도메인(workers.dev)을 먼저 등록하세요"; exit 1; }
          curl -fsS "$url/" && echo
          f=$(curl -s -m 20 "$url/fear" || true); echo "::notice::공포·탐욕 /fear 응답: ${f:0:300}"
          st=$(curl -s -m 20 "$url/status" || true); echo "::notice::/status: $st"
          hbr=$(curl -s -m 20 "$url/hb" | grep -o '"ready":[a-z]*' || true); echo "::notice::/hb $hbr"
          gpr=$(curl -s -m 20 "$url/grp" | grep -o '"ready":[a-z]*' || true); echo "::notice::/grp $gpr"
          nws=$(curl -s -m 20 "$url/news/status" | grep -o '"ai":[a-z]*' || true); echo "::notice::/news/status $nws (Workers AI 연결)"
          printf '{"endpoint":"%s"}\n' "$url" > ../data/counter.json
      - name: 주소 저장 (바뀐 경우에만 커밋)
        if: steps.chk.outputs.skip != '1'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git add data/counter.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: 방문자 수 카운터 주소 저장"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1
